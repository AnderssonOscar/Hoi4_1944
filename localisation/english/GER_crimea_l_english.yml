l_english:
 GER_crimea_evacuation:0 "Evacuate the Crimea"
 GER_crimea_evacuation_desc:0 "Ship the 17th Army out of the Crimea across the Black Sea while Sevastopol is still ours. The evacuation takes a month."
 GER_crimea_evacuation_tt:0 "After §Y30 days§!, every German division in the Crimea is shipped to Constanta, or, if we and our allies no longer hold it, to Odessa or Mykolaiv, or to the capital if we hold none of them. Allied Romanian divisions in the Crimea go with them, to Constanta or home.\nWe must hold §YSevastopol§! the whole time; if it falls, the evacuation fails."
 GER_crimea_port_tt:0 "We hold Sevastopol"
 GER_crimea_fortress:0 "Fortress Sevastopol"
 ger_crimea.1.t:0 "The 17th Army Is Cut Off"
 ger_crimea.1.d:0 "Since the enemy reached the Perekop isthmus, the Crimea has been cut off by land. The 17th Army, some 200,000 German and Romanian soldiers, can now be supplied only across the Black Sea.\n\nField Marshals von Manstein and von Kleist, the Chief of the General Staff, Zeitzler, and Marshal Antonescu all urge us to evacuate the peninsula while there is still time. Grand Admiral Dönitz disagrees: the Crimea, he says, protects the Balkans like a shield. The Führer has so far refused every request to withdraw."
 ger_crimea.1.a:0 "Evacuate the Crimea while there is still time."
 ger_crimea.1.a.tt:0 "The decision §YEvacuate the Crimea§! becomes available (50 political power). After §Y30 days§!, if we still hold §YSevastopol§!, every German division in the Crimea is shipped to Constanta, with our Romanian allies."
 ger_crimea.1.b:0 "Sevastopol is a fortress. It will be held."
 ger_crimea.1.b.tt:0 "Sevastopol becomes a fortress: while we hold it, its defenders get §G+20%§! defence, §G+75%§! maximum dig-in and §G-25%§! supply use. We can still order the evacuation later."
 ger_crimea.2.t:0 "The Crimea Evacuated"
 ger_crimea.2.d:0 "The last ships have left Sevastopol. Escorted by German and Romanian warships across the Black Sea, the divisions of the 17th Army are back on the mainland, where they are needed to hold the front."
 ger_crimea.2.a:0 "They got out in time."
