l_english:
 festung_berlin.1.t:0 "The Berlin Defence Area"
 festung_berlin.1.d:0 "The enemy has reached the lands bordering Brandenburg. The Führer has ordered that the capital be defended to the last man and the last cartridge, but there is almost nothing to build on. Work begins on the city's defences: an outer and an inner defence ring, and a 'Zitadelle' around the government quarter at their heart."
 festung_berlin.1.a:0 "Berlin will be defended."
 festung_berlin.1.a.tt:0 "Over the next six weeks, fortifications are built in the provinces Germany still holds: Berlin to fort level §Y2§!, then §Y4§!, then §Y5§! (every three weeks), and the five provinces around Berlin to §Y1§!, then §Y2§!. Existing forts are topped up, never added on top."
 festung_berlin.2.t:0 "The Seelow Heights"
 festung_berlin.2.d:0 "The enemy stands on the Oder opposite the Seelow Heights. The defenders do not intend to fight on the riverbank: they leave only a thin screen along the Oder and fortify the heights, with three lines of defence behind them reaching back towards Berlin. Engineers release water from a reservoir upstream, turning the floodplain below the heights into a swamp."
 festung_berlin.2.a:0 "Hold the heights."
 festung_berlin.2.a.tt:0 "Seelow's fort is raised to level §Y2§!, and to §Y4§! three weeks later (existing forts are topped up, never added on top). While Germany holds Seelow, its defenders get §G+10%§! defence and §G+50%§! maximum dig-in."
 festung_berlin.3.t:0 "Clausewitz"
 festung_berlin.3.d:0 "The code word 'Clausewitz' has been given: Berlin is now a front-line city. Wehrmacht and SS offices are evacuated and their files burned. The Berlin police and boys of the Hitler Youth are formed into emergency units, and the three great flak towers at the Zoo, in Friedrichshain and in Humboldthain become fortresses in the middle of the city."
 festung_berlin.3.a:0 "To the barricades."
 festung_berlin.3.a.tt:0 "Three weak emergency divisions appear in Berlin: the Berlin police, the Hitler Youth and other emergency units (untrained, 50–75% equipped).\nWhile Germany owns and controls Brandenburg, enemy units there move §R10%§! slower and forts there are §G10%§! more effective.\nIf the Festung Cities focus has not already done so, a human-led Germany also gets the Festung bonus in Berlin: §G+20%§! defence, §G+75%§! maximum dig-in, §G-25%§! supply use."
 festung_berlin.4.t:0 "Weidling Takes Command"
 festung_berlin.4.d:0 "General Helmuth Weidling, an artillery general, has been named commander of the Berlin Defence Area. He divides the city into eight defence sectors, 'A' to 'H', each commanded by a colonel or a general, though most of them have no combat experience."
 festung_berlin.4.a:0 "Every street a fortress."
 festung_berlin.5.t:0 "Berlin Is Encircled"
 festung_berlin.5.d:0 "The ring around Berlin has closed. All hopes now rest on General Wenck's 12th Army, which is to break through to the capital from the south-west."
 festung_berlin.5.a:0 "Where is Wenck?"
 festung_berlin.20.t:0 "The Battle for Berlin"
 festung_berlin.20.d:0 "Enemy armies have reached the approaches to Berlin. The German capital, ordered to be defended to the last man, prepares for a battle fought street by street."
 festung_berlin.20.a:0 "The fate of Berlin will be decided."
 GER_battle_for_berlin:0 "Battle for Berlin"
 GER_battle_for_berlin_desc:0 "Blown bridges, barricades and rubble slow the enemy, and the city's strongpoints make its fortifications more effective."
 GER_seelow_heights_modifier:0 "Seelow Heights"
 GER_festung_berlin_city_modifier:0 "Festung Berlin"
