l_english:
 GER_reserves_luftwaffe_to_the_front:0 "Luftwaffe Men to the Front"
 GER_reserves_luftwaffe_to_the_front_desc:0 "Hand tens of thousands of Luftwaffe men over to the ground war. The army needs them more than the air force does, but the squadrons that remain will feel their loss."
 GER_reserves_luftwaffe_men_at_the_front:0 "Luftwaffe Men at the Front"
 GER_reserves_luftwaffe_men_at_the_front_desc:0 "Tens of thousands of Luftwaffe men have been handed over to the ground war. The squadrons that remain are short of trained hands."
 GER_reserves_swedish_parts:0 "The Last Swedish Deliveries"
 GER_reserves_swedish_parts_desc:0 "Swedish steel and machine parts are speeding up our aircraft production: every type of aircraft is 13% cheaper to build, so the same factories turn out about 15% more."
 GER_reserves_eastern_workers_enlisted:0 "Eastern Workers in Uniform"
 GER_reserves_eastern_workers_enlisted_desc:0 "The eastern workers who have enlisted are missing from our factories."
 ger_reserves.1.t:0 "The Estonian Mobilisation"
 ger_reserves.1.d:0 "The Red Army has pushed almost to the old Estonian border. Jüri Uluots, the last prime minister of the Estonian Republic before the Soviet occupation, has spoken on the radio: he urges every able-bodied man born from 1904 to 1923 to report for military service. Armed Estonians, he argues, may one day be of use against both the Soviets and us.\n\n38,000 men have reported to our registration centres. They will form seven border guard regiments and fill the ranks of the 20th Estonian SS Volunteer Division."
 ger_reserves.1.a:0 "They will defend their homeland."
 ger_reserves.2.t:0 "Collaborators Flee East"
 ger_reserves.2.d:0 "Paris is in enemy hands. Those who served us in the West know what awaits them at home, and they are fleeing east ahead of the Allied armies: members of the French Milice now, and soon collaborators from the Netherlands, afraid of reprisals. Many of the men are ready to fight on in our ranks, some 2,500 from the Milice alone.\n\nA few volunteers from neutral countries stay with us too, among them Spaniards who refused to go home when the Blue Legion was recalled."
 ger_reserves.2.a:0 "They have nowhere left to go."
 ger_reserves.3.t:0 "Hungarian SS Divisions"
 ger_reserves.3.d:0 "Since Horthy was overthrown and the Arrow Cross took power in Budapest, the SS has begun raising Hungarian divisions under its own command. The first, the 25th Waffen-Grenadier-Division der SS 'Hunyadi', is being formed from the Hungarian 13th Division and a ski battalion, and will train at Neuhammer in Silesia.\n\nThe men are there. The weapons and vehicles to equip them are not."
 ger_reserves.3.a:0 "Hungary's men will fight under our command."
 ger_reserves.4.t:0 "Luftwaffe Men to the Front"
 ger_reserves.4.d:0 "The Luftwaffe has given up men to the ground war before: at the end of 1943 its field divisions were handed over to the army, and in September 1944 the 1st Parachute Army was formed, 30,000 strong. Now it hands over tens of thousands more.\n\nMen who serviced aircraft, ran airfields or trained for a cockpit they will never see must now learn to fight as infantry. The squadrons that remain will feel their absence."
 ger_reserves.4.a:0 "Every man is needed on the ground."
 ger_reserves.4.a.tt:0 "§Y75,000§! men have been added to our manpower. For §Y90 days§!, our air missions are §R10%§! less effective."
 ger_reserves.5.t:0 "The Last Swedish Deliveries"
 ger_reserves.5.d:0 "The Swedish government has closed its Baltic ports to our ships. Stockholm has been drawing away from us since it ended the transit of our soldiers on leave through Sweden last year, but it kept selling us steel and machine parts, at a price.\n\nThe last cargoes that could still be loaded have now reached Stettin and Kiel. The machine parts go to our aircraft factories."
 ger_reserves.5.a:0 "The last ships are in."
 ger_reserves.6.t:0 "Eastern Workers and Prisoners Volunteer"
 ger_reserves.6.d:0 "Since General Vlasov's Committee for the Liberation of the Peoples of Russia was founded in Prague in November, Soviet prisoners of war and eastern workers have been volunteering for its armed forces. For the prisoners, it is a way out of camps where they have been starving. The eastern workers join in such numbers that Vlasov's second division has nearly doubled in size.\n\nEvery man who enlists is one less worker in our factories."
 ger_reserves.6.a:0 "Let them enlist."
 ger_reserves.6.b:0 "They are needed in the factories."
 ger_reserves.6.b.tt:0 "The eastern workers stay at their machines."
 ger_reserves.7.t:0 "Round-ups Behind the Front"
 ger_reserves.7.d:0 "Behind the crumbling front, the Feldjäger comb the rear areas for stragglers and deserters. Their flying courts-martial pass sentence on the spot, and thousands have already been executed as a warning to others.\n\nEvery man they catch is sent back into the line. Here and there, even foreigners the party considers reliable are handed a rifle and a Volkssturm armband."
 ger_reserves.7.a:0 "Send them to the front."
