l_english:
 GER_nero_decree:0 "The Nero Decree"
 GER_nero_decree_desc:0 "Hitler's order on demolitions in Reich territory, remembered as the Nero Decree, commands that all military, industrial, transport and supply facilities that could be of use to the enemy be destroyed before they fall into enemy hands."
 GER_nero_decree_tt:0 "In every German core state held by the enemy, enemy units move §R10%§! slower and capture §R50%§! less equipment. When the enemy takes a German core state, its factories, infrastructure and railways are wrecked first (once per state). §YAlbert Speer§! may try to undermine the decree."
 GER_werwolf_decision:0 "Werwolf"
 GER_werwolf_decision_desc:0 "Small groups of fanatics and Hitler Youth are to stay behind in territory the enemy occupies, cutting railways, ambushing patrols and punishing Germans who work with the occupiers."
 GER_werwolf_decision_tt:0 "In German core states held by the enemy, occupying troops move §R5%§! slower. Once a month, where resistance is above §Y25%§!, the Werwolf cut the railways: the occupier cannot use strategic redeployment there for 35 days, and the railway is damaged when a sabotage campaign begins."
 GER_werwolf:0 "Werwolf"
 GER_werwolf_desc:0 "Werwolf fighters operate behind enemy lines in occupied German territory."
 GER_nero_decree_occupied:0 "Nero Decree"
 GER_nero_decree_occupied_desc:0 "German demolition orders: the occupier moves slower and captures less equipment here."
 GER_nero_decree_spared_occupied:0 "Nero Decree (undermined by Speer)"
 GER_nero_decree_spared_occupied_desc:0 "Half-hearted demolitions: the occupier is only slightly hindered here."
 GER_werwolf_occupied:0 "Werwolf Activity"
 GER_werwolf_occupied_desc:0 "Werwolf fighters harass the occupying troops."
 GER_werwolf_rails_sabotaged:0 "Railways Sabotaged"
 GER_werwolf_rails_sabotaged_desc:0 "The Werwolf have cut the railways: no strategic redeployment for the occupier."
 downfall_ger.1.t:0 "Speer Undermines the Nero Decree"
 downfall_ger.1.d:0 "Albert Speer, the Minister of Armaments, is quietly working against the Nero Decree. He has been travelling to the fronts to persuade Gauleiters and army commanders to ignore the demolition orders, arguing that the German people will need their factories, bridges and railways after the war."
 downfall_ger.1.a:0 "Enforce the decree to the letter."
 downfall_ger.1.a.tt:0 "The Nero Decree stays at full strength."
 downfall_ger.1.b:0 "Let Speer spare the factories."
 downfall_ger.1.b.tt:0 "The Nero Decree is halved: in German core states held by the enemy, enemy units move §R5%§! slower and capture §R25%§! less equipment. States the enemy takes from now on lose some infrastructure and railway, but their §Yfactories are spared§!."
 downfall_ger.2.t:0 "Radio Werwolf Goes on Air"
 downfall_ger.2.d:0 "A new German radio station calling itself Radio Werwolf has begun broadcasting, calling on every German to fight a guerrilla war against the occupying armies: to cut railway lines, ambush patrols and punish anyone who collaborates. How much of the movement is real, and how much is propaganda, remains to be seen."
 downfall_ger.2.a:0 "A war in the shadows begins."
