hungary.operation.panzerfaust.1:0 "Operation Panzerfaust"
hungary.operation.panzerfaust.1.t:0 "Operation Panzerfaust"
hungary.operation.panzerfaust.1.d:0 "We have recived word that Miklós Horthy again secretly negotiating his country's surrender.\nWe should intervene now or else Hungary might become our enemy."

mod.news.3.d:0 "After Hungary's leadership began exploring options for negotiating\n a separate peace with the Allies. The German forces launched Operation Margarethe.\n\nThey quickly invaded Hungary without significant resistance from the Hungarian military or government.\nBudapest and other key cities and strategic locations in the country were seized. In a German friendly government Horthy's is allowed to remain in power"

mod.news.2.d:0 "Today Miklós Horthy announced on national radio broadcast that Hungary had signed an armistice with the Soviets. Not long after the broadcast Horthy was captured and deposed by German forces, led by SS officer Otto Skorzeny. With Horthy gone a new German puppet goverment have been declared."

mod.news.1.d:0 "Today the liberation of Europe has begun with allied troops landing on french beaches\n\nThis massive Allied military operation will be a pivotal moment in the war and mark the beginning of the liberation of Western Europe from Nazi German occupation."

SOV_leningrad_defence_modifier:0 "Leningrad Defence"
GER_festung_konigsberg_modifier:0 "Festung Königsberg"
ALLIED_prepared_invasion_modifier:0 "Prepared Invasion"

mod.news.4.d:0 "With the advancing Soviet Red Army Königsberg has been well-fortified, with a combination of old and modern defenses. The city has medieval fortifications and a network of forts and bunkers built during these last years. These fortifications will make it a formidable stronghold."

mod.news.5.d:0 "Königsberg has finally succumbed to the Red Army earlier this day.\n\nOriginally founded in the 13th century by the Teutonic Knights, with a long and eventfull history finally put to rest, there are only ruins left behind from this once well known historical city."

rhine.defence.0:0 "Defence Of The Rhine"
rhine.defence.0.t:0 "Defence Of The Rhine"
rhine.defence.0.d:0 "As The Allies seek to advance into Germany from the west the Rhine River serves as the last natural barrier in front of the german interior.\n\nShould we destroy the bridges to stop the invader?"
rhine.defence.0.tt:0 "§YRailways left side of the Rhine will be destroyed.\n\nImprovised fortifications will be constructed on the right bank.\n§ §W§"

mod.news.7:0 "Rhine Crossing"
mod.news.7.t:0 "Rhine Crossing"
mod.news.7.d:0 "The Allies has successfully established bridgeheads on the eastern bank of the Rhine. Once these bridgeheads are secured, additional troops and equipment will be rapidly brought across the river."

mod.news.6:0 "Paris Liberated"
mod.news.6.t:0 "Paris Liberated"
mod.news.6.d:0 "Today marks the end of German occupation in the French capital. \nThe liberation of Paris was met with widespread jubilation. Parisians poured into the streets to celebrate their freedom after years of German occupation.\n\nThe occupation of Paris is finally over."

mod.news.9:0 "Soviet invasion of Manchuria"
mod.news.9.t:0 "Soviet invasion of Manchuria"
mod.news.9.d:0 "Today the Soviets declared war on Japan and launched an invasion of Manchuria.\n\nThe primary objective of the invasion is to swiftly defeat Japanese forces in Manchuria and Korea, as well as to secure territory and influence in the post-war order in Asia."

