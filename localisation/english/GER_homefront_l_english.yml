l_english:
 GER_homefront_flak_auxiliaries:0 "Women at the Flak"
 GER_homefront_flak_auxiliaries_desc:0 "Women of the Reich Labour Service serve in the Flak batteries at home, releasing soldiers for the front."
 GER_homefront_class_of_1929:0 "The Class of 1929"
 GER_homefront_class_of_1929_desc:0 "Boys of fifteen and sixteen are called up and sent to the front after a short basic training."
 ger_homefront.1.t:0 "Women's Labour Service Extended to 50"
 ger_homefront.1.d:0 "Every man who can be spared from the factories is needed at the front. The age limit for women's compulsory labour service has been raised from 45 to 50, so that more women can take over work in the war industry.\n\nThe men they replace will be released for military service."
 ger_homefront.1.a:0 "Every hand for the war effort."
 ger_homefront.2.t:0 "The Death of Field Marshal Rommel"
 ger_homefront.2.d:0 "The investigation into the 20 July plot has reached Field Marshal Erwin Rommel. On 14 October, Generals Burgdorf and Maisel came to his house in Herrlingen and gave him a choice: to stand trial before the People's Court, or to take his own life in return for a state funeral. He took poison in their car shortly afterwards.\n\nThe public is told that the Field Marshal died of heart failure, a result of the injuries he suffered in the West. He will be buried with full honours in Ulm on 18 October, where Field Marshal von Rundstedt is to deliver the eulogy: 'His heart belonged to the Führer.'"
 ger_homefront.2.a:0 "Announce a state funeral."
 ger_homefront.2.a.tt:0 "Field Marshal §YErwin Rommel§! is dead."
 ger_homefront.3.t:0 "RAD Women at the Flak"
 ger_homefront.3.d:0 "The Flak batteries defending our cities are manned by soldiers the front urgently needs. From now on, young women of the Reich Labour Service are assigned to the Flak as auxiliaries, so that those soldiers can be released for front-line service.\n\nNight after night, the women will share the batteries' war against the bombers."
 ger_homefront.3.a:0 "Release the men for the front."
 ger_homefront.4.t:0 "An Air Force for Vlasov"
 ger_homefront.4.d:0 "Reichsmarschall Göring has signed an order creating an air force for General Vlasov's Russian Liberation Army. Under Viktor Maltsev, it is to have fighter, night-bomber, reconnaissance, liaison and transport squadrons and its own anti-aircraft and airborne units, manned by Russian airmen and mechanics.\n\nThe Luftwaffe must hand over aircraft it can hardly spare, and many of our leaders distrust any armed Russians."
 ger_homefront.4.a:0 "Sign the order."
 ger_homefront.4.b:0 "Not one aircraft for the Russians."
 ger_homefront.4.b.tt:0 "The Luftwaffe keeps its aircraft."
 ger_homefront.5.t:0 "The Volksopfer"
 ger_homefront.5.d:0 "The Volkssturm has men, but not the clothing and equipment to fit them out. Goebbels, Himmler and Funk have called for a 'people's sacrifice': from 7 to 28 January the population is to hand in clothing and equipment of every kind for the Volkssturm and the Wehrmacht, at 60,000 Party collection points. 'Give everything for the front!'\n\nCoats, boots, blankets, rucksacks and old uniforms will come in, worn and mixed, but they will keep men warm in the last winter of the war."
 ger_homefront.5.a:0 "Call on the people."
 GER_homefront_volksopfer_clothing:0 "The Volksopfer"
 GER_homefront_volksopfer_clothing_desc:0 "Coats, boots and blankets handed in by the population keep our soldiers and the Volkssturm warmer through the last winter of the war."
 ger_homefront.5.b:0 "The people have given enough."
 ger_homefront.5.b.tt:0 "Nothing is collected."
 ger_homefront.6.t:0 "The Sinking of the Wilhelm Gustloff"
 ger_homefront.6.d:0 "In the night of 30 January, the Wilhelm Gustloff was torpedoed in the icy Baltic off the coast of Pomerania. The former cruise liner had left Gotenhafen crammed far beyond capacity with people fleeing the Red Army: refugees from East Prussia, most of them women, children and old people, together with wounded soldiers, naval auxiliaries and U-boat trainees. More than 10,000 people may have been aboard.\n\nThe Soviet submarine S-13 hit her with three torpedoes. In the darkness and the freezing water, most of those aboard had no chance. Some 9,000 people died, most of them refugees: the greatest loss of life in the sinking of a single ship.\n\nFor the survivors and for the families of the dead, it was nothing less than a crime against defenceless people."
 ger_homefront.6.a:0 "We will not forget them."
 ger_homefront.7.t:0 "Women and Girls for the Volkssturm"
 ger_homefront.7.d:0 "The party has called on women and girls to serve as auxiliaries with the Volkssturm. They are to take over the work behind the lines, so that more men can take up rifles; some girls as young as fourteen are even being trained to use weapons.\n\nMany families now have a father in the Wehrmacht, a son in the Volkssturm, and a mother or a daughter in its auxiliary service."
 ger_homefront.7.a:0 "Every hand is needed."
 ger_homefront.8.t:0 "The Class of 1929"
 ger_homefront.8.d:0 "All boys born in 1929 are being called up: they are fifteen and sixteen years old. After a short basic training, they are to be sent to the front.\n\nThere is no time to train them properly, and no one else left to send."
 ger_homefront.8.a:0 "There is no one else."
