l_english:
 slovak.uprising.1.t:0 "The Slovak National Uprising"
 slovak.uprising.1.d:0 "On 29 August 1944, units of the Slovak army rose up against the Tiso government and the German forces entering the country. Together with partisans in the mountains of central Slovakia, the insurgents have seized Banská Bystrica, where the Slovak National Council calls for a free Czechoslovakia.\n\nThousands of soldiers have gone over to the uprising. German troops are moving in to crush it."
 slovak.uprising.1.a:0 "The uprising must be crushed."
 slovak.uprising.1.tt:0 "§YSlovakia§! loses §R3,000§! manpower as army units go over to the uprising."
