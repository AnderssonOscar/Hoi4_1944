l_english:
 GER_1945_sonnenwende:0 "Operation Sonnenwende"
 GER_1945_sonnenwende_desc:0 "Assemble the counterattack from the Stargard area towards Arnswalde. Fuel, weapons and ammunition are set aside while the attack is assembled, and handed back to the attacking divisions the moment it begins."
 GER_1945_sonnenwende_tt:0 "Sets aside §Y5,000§! fuel, §Y500§! infantry equipment and §Y50§! artillery for §Y7 days§! of preparation. When the attack begins, all of it is returned, and for §Y12 days§! German troops fighting on German soil in Hinterpommern, Ostmark and Brandenburg get §G+15%§! attack.\nIf we lose Stettin before the attack begins, it is called off and everything is returned."
 GER_1945_sonnenwende_front_tt:0 "The enemy holds part of Ostmark"
 GER_1945_spring_awakening:0 "Operation Spring Awakening"
 GER_1945_spring_awakening_desc:0 "Assemble the 6th SS Panzer Army between Lake Balaton and the Danube. Fuel, weapons and ammunition are set aside while it assembles, and handed back to the attacking divisions the moment the offensive begins."
 GER_1945_spring_awakening_tt:0 "Sets aside §Y7,500§! fuel, §Y750§! infantry equipment and §Y75§! artillery for §Y10 days§! of preparation. When the offensive begins, all of it is returned, and for §Y14 days§! our troops get §G+10%§! attack against the Soviet Union (Hungary's too, if it is still our ally).\nIf the oil fields of South Transdanubia are lost before the offensive begins, it is called off and everything is returned."
 GER_1945_spring_awakening_front_tt:0 "We or our allies still hold North Transdanubia and the oil fields of South Transdanubia"
 GER_1945_courland_evacuation:0 "Evacuate Army Group Courland"
 GER_1945_courland_evacuation_desc:0 "Bring the divisions trapped in Courland home by sea. The ships can only load at Libau (Liepāja) and Windau (Ventspils), and the evacuation takes a month."
 GER_1945_courland_evacuation_tt:0 "After §Y30 days§!, every German division in Courland is shipped to a Baltic port we still hold: Gotenhafen (Gdynia), Danzig, Stettin, Vorpommern or Kiel, in that order, or to the capital if we hold none of them.\nWe must hold §YLibau (Liepāja)§! or §YWindau (Ventspils)§! the whole time; if both fall, the evacuation fails."
 GER_1945_courland_ports_tt:0 "We hold Libau (Liepāja) or Windau (Ventspils)"
 GER_1945_sailors_to_the_front:0 "Sailors to the Front"
 GER_1945_sailors_to_the_front_desc:0 "The Kriegsmarine has more sailors than ships and submarines left to man. Those it can spare are to fight as infantry. Some of the transport ships they served on are laid up for good, and their specialists go to the replacement pool."
 GER_1945_sailors_to_the_front_tt:0 "Three naval infantry divisions are formed: the §Y1st§! at Stettin now, the §Y2nd§! at Kiel a month later and the §Y3rd§! in Vorpommern a month after that (at the capital if we no longer hold the area). They are ordinary infantry, not marines, so they do not count towards the special forces limit. They are poorly equipped (50%) and have no combat experience."
 GER_1945_sonnenwende_attack:0 "Operation Sonnenwende"
 GER_1945_sonnenwende_attack_desc:0 "German troops fighting on German soil here get extra attack while the counterattack lasts."
 GER_1945_spring_awakening_offensive:0 "Operation Spring Awakening"
 GER_1945_spring_awakening_offensive_desc:0 "The 6th SS Panzer Army is on the attack at Lake Balaton."
 GER_1945_courland_fortress:0 "Fortress Courland"
 ger_1945.1.t:0 "Operation Sonnenwende"
 ger_1945.1.d:0 "The Red Army has pushed through to the Oder, driving a great salient towards Berlin. We can strike its exposed northern flank: from the area around Stargard in Pomerania, the newly assembled 11th SS Panzer Army is to attack south-east towards Arnswalde, where one of our garrisons is surrounded.\n\nThe plan is bold, but fuel and ammunition for only a few days of fighting can be scraped together. If we commit to it, those supplies must be set aside now, while the attack is assembled."
 ger_1945.1.a:0 "Prepare the counterattack."
 ger_1945.1.a.tt:0 "The decision §YOperation Sonnenwende§! becomes available (50 political power). It sets aside §Y5,000§! fuel, §Y500§! infantry equipment and §Y50§! artillery for 7 days, returns them when the attack begins, and gives German troops fighting on German soil in Hinterpommern, Ostmark and Brandenburg §G+15%§! attack for 12 days."
 ger_1945.1.b:0 "We cannot spare the fuel."
 ger_1945.2.t:0 "Sonnenwende Begins"
 ger_1945.2.d:0 "The counterattack has begun, catching the Soviets by surprise. In the centre, the SS Division Nordland is driving on Arnswalde to relieve its surrounded garrison. The fuel set aside for the operation is in the tanks now, but there is only enough for a few days of fighting."
 ger_1945.2.a:0 "Forward!"
 ger_1945.2.a.tt:0 "For §Y12 days§! German troops fighting on German soil in Hinterpommern, Ostmark and Brandenburg get §G+15%§! attack. The supplies set aside have been returned."
 ger_1945.3.t:0 "Sonnenwende Halted"
 ger_1945.3.d:0 "The offensive has run out of steam. It caught the Soviets by surprise, but it stalled against stiff resistance, and the few days' fuel and ammunition are spent. Yet the blow has not been wasted: before the Soviets can attack Berlin, they must now clear Pomerania."
 ger_1945.3.a:0 "We have bought time."
 ger_1945.4.t:0 "Operation Spring Awakening"
 ger_1945.4.d:0 "The Red Army has pushed deep into Hungary. Its next blows will fall on the oil fields around Nagykanizsa in south-western Hungary, among the most valuable assets we have left in the east, and on the road to Vienna. The Führer has ordered the 6th SS Panzer Army, brought east after the Ardennes offensive, to strike from the area of Lake Balaton and drive the Soviets back to the Danube.\n\nSuch an offensive needs every drop of fuel we can find. If we commit to it, fuel and weapons must be set aside while the panzer army assembles."
 ger_1945.4.a:0 "Prepare the offensive."
 ger_1945.4.a.tt:0 "The decision §YOperation Spring Awakening§! becomes available (50 political power). It sets aside §Y7,500§! fuel, §Y750§! infantry equipment and §Y75§! artillery for 10 days, returns them when the offensive begins, and gives our troops §G+10%§! attack against the Soviet Union for 14 days (Hungary's too, if it is still our ally)."
 ger_1945.4.b:0 "The oil is not worth an army."
 ger_1945.5.t:0 "Spring Awakening Begins"
 ger_1945.5.d:0 "The last great German offensive of the war has begun. The main thrust drives between Lake Balaton and the Danube, with further attacks south of the lake and from beyond the Drava. But the Soviets have been expecting us behind deep anti-tank defences, and the ground is soft with the spring thaw."
 ger_1945.5.a:0 "For the oil fields!"
 ger_1945.5.a.tt:0 "For §Y14 days§! our troops get §G+10%§! attack against the Soviet Union. The supplies set aside have been returned."
 ger_1945.6.t:0 "Spring Awakening Ends"
 ger_1945.6.d_held:0 "The offensive has bled out against the Soviet defences, and the 6th SS Panzer Army is worn down. But for now the oil fields of south-western Hungary are still in Axis hands."
 ger_1945.6.d_lost:0 "The offensive has failed, and the Soviets have struck back. The oil fields of south-western Hungary are lost, and every drop of fuel we still have is worth more than ever."
 ger_1945.6.a:0 "It was our last reserve."
 ger_1945.8.t:0 "Army Group Courland"
 ger_1945.8.d:0 "The Red Army has reached the Baltic coast and cut off our armies in western Latvia. They hold a pocket in Courland around the ports of Libau (Liepāja) and Windau (Ventspils).\n\nThe Chief of the General Staff urges us to bring these divisions home by sea, to shore up the front in Germany. The Führer insists that Courland be held: it protects our U-boat bases on the Baltic, and one day it could be the bridgehead for a new offensive.\n\nAn evacuation would take about a month, and for all that time we must hold Libau or Windau, the only ports the ships can use."
 ger_1945.8.a:0 "Bring them home by sea."
 ger_1945.8.a.tt:0 "The decision §YEvacuate Army Group Courland§! becomes available (50 political power). After §Y30 days§!, if we still hold §YLibau§! or §YWindau§!, every German division in Courland is shipped to a Baltic port we still hold."
 ger_1945.8.b:0 "Courland will be held."
 ger_1945.8.b.tt:0 "Libau and Windau become fortresses: while we hold them, their defenders get §G+20%§! defence, §G+75%§! maximum dig-in and §G-25%§! supply use. We can still order the evacuation later."
 ger_1945.9.t:0 "Courland Evacuated"
 ger_1945.9.d:0 "The last transports have sailed. Loaded at Libau and Windau and escorted across the Baltic, the divisions of Army Group Courland have reached the ports of the Reich, where they are needed for the final battles."
 ger_1945.9.a:0 "Every division counts now."
 ger_1945.11.t:0 "2nd Naval Infantry Division"
 ger_1945.11.d:0 "In Holstein, sailors who no longer have ships to man have been formed into the 2nd Naval Infantry Division. They are willing enough, but few of them have ever been trained to fight on land."
 ger_1945.11.a:0 "To the front."
 ger_1945.12.t:0 "3rd Naval Infantry Division"
 ger_1945.12.d:0 "In Pomerania, the 3rd Naval Infantry Division has been formed around the survivors of the shattered 163rd Infantry Division."
 ger_1945.12.a:0 "To the front."
