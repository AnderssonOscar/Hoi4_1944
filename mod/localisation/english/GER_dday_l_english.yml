l_english:
 ger_dday.1.t:0 "The Invasion Beaten Back"
 ger_dday.1.d:0 "The enemy's invasion of France has failed. After days of fighting on the beaches and behind them, the last of his bridgeheads has been wiped out, and his troops have been killed, taken prisoner or driven back to their ships. The Atlantic Wall has held.\n\nIt will be a long time before the enemy can try again."
 ger_dday.1.a:0 "The coast is ours again."
