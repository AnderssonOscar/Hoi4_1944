l_english:
 ger_bomb.1.t:0 "A New Sun"
 ger_bomb.1.d:0 "At a remote test range, before a small group of officers and scientists, a German atomic device has been detonated. The flash was brighter than the sun, and the cloud climbed for kilometres into the sky.\n\nIt began in 1939, when the physicists of the Uranverein first reported that splitting the uranium atom could release unheard-of energy. In 1942 the Army concluded that no bomb could be ready in time for this war, and the work went on in the laboratories, aimed at a reactor. Against all expectations it has produced a weapon. The first bomb is ready for use."
 ger_bomb.1.a:0 "Inform the Führer."
