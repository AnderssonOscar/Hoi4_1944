l_english:
 ger_legions.1.t:0 "The Indian Legion Comes Home"
 ger_legions.1.d:0 "The Indian Legion has left the Atlantic coast. Raised by Subhas Chandra Bose from Indian prisoners of war, it guarded the Bay of Biscay near Lacanau until the Allied advance made the coast untenable. On 15 August its men set out for Germany through Poitiers and Châteauroux, fighting French forces at Dun and Allied armour at Nuits-Saint-Georges. Three of its officers were killed on the way, and 25 legionaries went over to the Resistance. The French accuse the Legion of crimes against civilians in the Médoc and around Ruffec.\n\nBy Himmler's order of 8 August the Legion now belongs to the Waffen-SS. It is to go to Camp Heuberg."
 ger_legions.1.a:0 "Send them to Heuberg."
 ger_legions.1.a.tt:0 "No effect: the Legion stays in training at Heuberg."
 ger_legions.2.t:0 "The Handschar Falls Apart"
 ger_legions.2.d:0 "The 13th SS Division 'Handschar', raised from Bosnian Muslims to fight the Partisans in north-eastern Bosnia, is disintegrating. Since Tito's amnesty of 17 August, more than 2,000 Bosnians have deserted, many of them taking their weapons. Some have gone home, some to the Green Cadres or the Ustaše, and over 700 have joined the Partisans. After the fighting at Janja on 3 and 4 October, Army Group F judged the division's combat value to be minimal.\n\nIts German cadre and the men who remain are to be formed into a battle group. The division leaves behind a record of massacres of Serb civilians."
 ger_legions.2.a:0 "Form a battle group from what remains."
 ger_legions.3.t:0 "The Eastern Legions Pass to the SS"
 ger_legions.3.d:0 "Since 1942 the Army's Eastern Legions have recruited Soviet prisoners of war from Central Asia and the Caucasus: 53 field battalions, some 53,000 men. What is left of them is now being gathered under the SS. The East Turkic Waffen-Verband, 5,000 strong, has been formed in Slovakia, and on 30 December its Azerbaijani group passed to the new Caucasian Waffen-Verband.\n\nTheir loyalty is thin. On Christmas Eve 450 men deserted, and only 300 came back."
 ger_legions.3.a:0 "Gather them under the SS."
 ger_legions.4.t:0 "Wiking at Cherkassy"
 ger_legions.4.d.breakout:0 "The Soviet pincers closed around Korsun and Cherkassy, trapping some 60,000 men, the SS Division 'Wiking' and its Walloon volunteers among them. In the night of 16 to 17 February they broke out through the snow towards the relief force. About half of the trapped men reached our lines.\n\nWiking lost nearly all its tanks and heavy weapons, but it came out as a fighting division, and its veterans will stiffen the new formations."
 ger_legions.4.d.held:0 "The Soviet winter offensive in the Dnieper bend has broken against Cherkassy. The SS Division 'Wiking' and its Walloon volunteers held their positions through weeks of fighting in the snow, and the front there still stands.\n\nIts losses in men and equipment are heavy, but the division remains one of our most battle-hardened formations, and its veterans will stiffen the new ones."
 ger_legions.4.a:0 "Their example will steady the front."
 ger_legions.5.t:0 "The Blue Hills"
 ger_legions.5.d:0 "In the hills west of Narva that the Estonians call Sinimäed, the Blue Hills, the Soviet offensive against the Tannenberg Line has been held. Since 27 July the SS Division 'Nordland', its regiments named 'Norge' and 'Danmark' after their Norwegian and Danish volunteers, has fought there alongside the Estonian 20th SS Division and elements of 'Großdeutschland', beating back attack after attack.\n\nNordland's commander, Fritz von Scholz, was killed by artillery fire on 28 July. The line in Estonia still holds."
 ger_legions.5.a:0 "The line holds."
