l_english:
 GER_volkssturm_east:0 "Volkssturm: The Eastern Gaue"
 GER_volkssturm_east_desc:0 "On 12 January 1945 the Red Army opened its winter offensive from the Vistula. In the eastern Gaue the Volkssturm is sent into battle, many of its battalions into the cities declared fortresses, such as Königsberg, Posen and Breslau."
 GER_volkssturm_east_tt:0 "Up to §Y26§! Volkssturm divisions (§Y130§! battalions) are raised in East Prussia, Danzig-West Prussia, the Wartheland and Silesia, in the states Germany still holds. They are untrained and only §R40–75%§! armed."
 GER_volkssturm_east_front_tt:0 "The front has reached the eastern Gaue (an enemy holds part of one of their states, or a neighbouring state)"
 GER_volkssturm_east_held_tt:0 "Germany still holds at least one state of the eastern Gaue"
 GER_volkssturm_oder:0 "Volkssturm: The Oder and Pomerania"
 GER_volkssturm_oder_desc:0 "On 31 January 1945 Soviet troops reached the Oder north of Küstrin, about 80 kilometres from Berlin. Volkssturm battalions from Brandenburg and Pomerania are sent to hold the Oder line and the Pomeranian towns."
 GER_volkssturm_oder_tt:0 "Up to §Y10§! Volkssturm divisions (§Y50§! battalions) are raised in Hinterpommern, Vorpommern and Brandenburg, in the states Germany still holds. They are untrained and only §R40–75%§! armed."
 GER_volkssturm_oder_front_tt:0 "The front has reached Pomerania or Brandenburg (an enemy holds part of one of these states, or a neighbouring state)"
 GER_volkssturm_oder_held_tt:0 "Germany still holds Hinterpommern, Vorpommern or Brandenburg"
 GER_volkssturm_west:0 "Volkssturm: The Western Gaue"
 GER_volkssturm_west_desc:0 "On 8 February 1945 the Western Allies opened their offensive into the Rhineland. The Volkssturm of the western Gaue is called out, but many of its battalions have little will to fight."
 GER_volkssturm_west_tt:0 "Up to §Y6§! Volkssturm divisions (§Y30§! battalions) are raised in the Rhineland, Westphalia, Moselland and Weser-Ems, in the states Germany still holds. They are untrained and only §R40–75%§! armed."
 GER_volkssturm_west_front_tt:0 "The front has reached the western Gaue (an enemy holds part of one of their states, or a neighbouring state)"
 GER_volkssturm_west_held_tt:0 "Germany still holds at least one state of the western Gaue"
 GER_volkssturm_berlin:0 "Volkssturm: The Battle of Berlin"
 GER_volkssturm_berlin_desc:0 "On 16 April 1945 the Red Army attacked from the Oder towards Berlin. The capital's Volkssturm, tens of thousands of older men, many of whom served in the army when young and some in the First World War, is sent to the city's defences alongside boys of the Hitler Youth."
 GER_volkssturm_berlin_tt:0 "§Y5§! Volkssturm divisions (§Y25§! battalions) are raised in Brandenburg (Berlin), if Germany still holds it. They are untrained and only §R40–75%§! armed."
 GER_volkssturm_berlin_front_tt:0 "The front has reached Berlin (an enemy holds part of Brandenburg, or a neighbouring state)"
 GER_volkssturm_berlin_held_tt:0 "Germany still holds Brandenburg"
