l_english:
 GER_measures_konr_expand:0 "Expand the KONR Armed Forces"
 GER_measures_konr_expand_desc:0 "On 14 November 1944 General Vlasov proclaimed the Prague Manifesto of the Committee for the Liberation of the Peoples of Russia, the KONR. On 23 November the formation of its first division began at Münsingen. Himmler has won Hitler's permission for ten Russian divisions, yet only a few are being formed, and more volunteers are coming forward from the prisoner-of-war camps and among the eastern workers."
 GER_measures_konr_expand_tt:0 "A choice: §Ytwo more KONR divisions§! (the second after 60 days), each arriving half equipped with §Y805§! infantry equipment, §Y15§! support equipment and §Y6§! artillery from our stockpile, or the volunteers to our units as §Y12,000§! manpower."
 GER_measures_railway_repair:0 "Emergency Railway Repair Programme"
 GER_measures_railway_repair_desc:0 "Since September 1944 the Allied air forces have been hammering our railways: marshalling yards, junctions, bridges and moving trains. Coal, troops and munitions are stuck in wrecked stations. Reichsbahn repair gangs, the Organisation Todt and forced labourers are to put the lines back into service first, at the expense of every other building project. The SS has formed railway construction brigades of concentration camp prisoners for the same work: about 500 prisoners each, locked in freight wagons and moved from one bombed station to the next."
 GER_measures_student_companies:0 "Send the Student Companies to the Front"
 GER_measures_student_companies_desc:0 "Most of the men at our universities are soldiers, detached from the Wehrmacht to study war-important subjects such as medicine, chemistry and engineering. They live in student companies under military discipline, and until now they have gone to the front only in the vacations. Their studies are to end, and the companies are to go to the front for good."
 GER_measures_weapons_appeal:0 "Call on Citizens to Hand In Their Weapons"
 GER_measures_weapons_appeal_desc:0 "The Volkssturm has men but hardly any rifles. The Party is to find out which weapons can be issued to it, down to privately owned hunting rifles, shotguns and small-bore rifles, and owners are called on to hand theirs in. One Party district in Upper Franconia counted 107 hunting weapons in private hands. It will not be much, and most of it will be old, but it costs no goodwill."
 GER_measures_weapons_confiscation:0 "Confiscate Civilian Firearms"
 GER_measures_weapons_confiscation_desc:0 "Too few weapons were handed in. Households are to be checked for weapons still kept at home, and hunting rifles, shotguns and other private firearms taken for the Volkssturm. People will not forget the searches."
 ger_measures.1.t:0 "Volunteers for the KONR"
 ger_measures.1.d:0 "Since the Prague Manifesto, thousands of Soviet prisoners of war and eastern workers have asked to join General Vlasov's army. Some believe in a Russia without Stalin; many more simply want out of camps where millions of their comrades have died of hunger and disease. Hitler has allowed ten Russian divisions, but every rifle and gun they get must come out of our own stocks. We can arm two more KONR divisions, poorly trained, or put the men into our own worn-out units as replacements."
 ger_measures.1.a:0 "Arm two more KONR divisions."
 ger_measures.1.a.tt:0 "Each division arrives half equipped, paid from our stockpile: §Y805§! infantry equipment, §Y15§! support equipment and §Y6§! artillery. The §Y5th KONR Infantry Division§! will be raised in §Y60 days§!, if we are still at war with the Soviet Union and can pay for its equipment."
 ger_measures.1.b:0 "Send them to our units as replacements."
 ger_measures.3.t:0 "The Lecture Halls Empty"
 ger_measures.3.d:0 "The student companies have left for the front. Since 1941 soldier-students have made up most of the men at our universities, most of them medical students, moving back and forth between the lecture hall and the front line. Now the anatomy theatres and laboratories stand empty. The front gains men who have already seen combat. Our research institutes lose their assistants, and the hospitals the doctors they would have needed after the war."
 ger_measures.3.a:0 "The front needs them now."
 GER_measures_student_companies_spirit:0 "Student Companies at the Front"
 GER_measures_student_companies_spirit_desc:0 "The soldier-students have been sent back to their units for good. Research and the universities feel their absence, and families resent it."
