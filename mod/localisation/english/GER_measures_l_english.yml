l_english:
 GER_measures_konr_expand:0 "Expand the KONR Armed Forces"
 GER_measures_konr_expand_desc:0 "Since the Prague Manifesto of November 1944 the Committee for the Liberation of the Peoples of Russia, the KONR, has its own army under General Vlasov. Its first division stands at Münsingen, its second is forming at Heuberg, and a third has begun without weapons. Himmler won Hitler's permission for ten Russian divisions. Volunteers keep coming from the prisoner-of-war camps and among the eastern workers, but there is almost nothing left to arm them with."
 GER_measures_konr_expand_tt:0 "A choice: §Ytwo more KONR divisions§! (the second after 60 days), poorly armed with old German or captured rifles and at 30% of their equipment, paid from our stockpile (§Y453§! infantry equipment, §Y9§! support equipment and §Y4§! artillery each); or the volunteers to our units as §Y12,000§! manpower."
 GER_measures_railway_repair:0 "Emergency Railway Repair Programme"
 GER_measures_railway_repair_desc:0 "Since September 1944 the Allied air forces have been hammering our railways: marshalling yards, junctions, bridges and moving trains. Coal, troops and munitions are stuck in wrecked stations. Reichsbahn repair gangs, the Organisation Todt and forced labourers are to put the lines back into service first, at the expense of every other building project. The SS has formed railway construction brigades of concentration camp prisoners for the same work: about 500 prisoners each, locked in freight wagons and moved from one bombed station to the next."
 GER_measures_student_companies:0 "Send the Student Companies to the Front"
 GER_measures_student_companies_desc:0 "Most of the men at our universities are soldiers, detached from the Wehrmacht to study war-important subjects such as medicine, chemistry and engineering. They live in student companies under military discipline, and until now they have gone to the front only in the vacations. Their studies are to end, and the companies are to go to the front for good."
 GER_measures_weapons_appeal:0 "Call on Citizens to Hand In Their Weapons"
 GER_measures_weapons_appeal_desc:0 "The Volksopfer is under way: from 7 to 28 January the population hands in clothing and equipment for the Volkssturm and the Wehrmacht at 60,000 Party collection points. What the Volkssturm lacks most is rifles. Since November the Party has registered the private weapons that could be issued to it, down to hunting rifles, shotguns and small-bore rifles; one district in Upper Franconia counted 107 hunting weapons in private hands. Now their owners are called on to bring them to the collection points as well. It will not be much, and most of it will be old, but it costs no goodwill."
 GER_measures_weapons_confiscation:0 "Confiscate Civilian Firearms"
 GER_measures_weapons_confiscation_desc:0 "The Volksopfer collection has closed, and too few weapons came in. Households are to be checked for weapons still kept at home, as the Party ordered in December, and hunting rifles, shotguns and other private firearms taken for the Volkssturm. People will not forget the searches."
 ger_measures.1.t:0 "Volunteers for the KONR"
 ger_measures.1.d:0 "Since the Prague Manifesto, thousands of Soviet prisoners of war and eastern workers have asked to join General Vlasov's army. Some believe in a Russia without Stalin; many more simply want out of camps where millions of their comrades have died of hunger and disease. Hitler has allowed ten Russian divisions, but every rifle and gun they get must come out of our own stocks, and what we can spare is old: German rifles from depot stocks, captured Soviet weapons, whatever else the depots hold. We can arm two more KONR divisions, poorly trained and poorly armed, or put the men into our own worn-out units as replacements."
 ger_measures.1.a:0 "Arm two more KONR divisions."
 ger_measures.1.a.tt:0 "Each division arrives with §Y30%§! of its equipment, paid from our stockpile: §Y453§! infantry equipment, §Y9§! support equipment and §Y4§! artillery. Its rifles are old German (50%), captured Soviet (40%) or other captured rifles (10%). The §Y5th KONR Infantry Division§! will be raised in §Y60 days§!, if we are still at war with the Soviet Union and can pay for its equipment."
 ger_measures.1.b:0 "Send them to our units as replacements."
 ger_measures.3.t:0 "The Lecture Halls Empty"
 ger_measures.3.d:0 "The student companies have left for the front. Since 1941 soldier-students have made up most of the men at our universities, most of them medical students, moving back and forth between the lecture hall and the front line. Now the anatomy theatres and laboratories stand empty. The front gains men who have already seen combat. Our research institutes lose their assistants, and the hospitals the doctors they would have needed after the war."
 ger_measures.3.a:0 "The front needs them now."
 GER_measures_student_companies_spirit:0 "Student Companies at the Front"
 GER_measures_student_companies_spirit_desc:0 "The soldier-students have been sent back to their units for good. Research and the universities feel their absence, and families resent it."
