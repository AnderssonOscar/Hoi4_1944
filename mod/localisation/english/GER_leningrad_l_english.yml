l_english:
 ger_leningrad.1.t:0 "Leningrad Taken"
 ger_leningrad.1.d:0 "Our troops have fought their way into the heart of Leningrad. German soldiers stand on the Nevsky Prospect beneath the dome of St Isaac's Cathedral, and the city is ours.\n\nIn September 1941 the Führer ordered that the city was not to be taken but starved into ruin. Hundreds of thousands of its people have died since then, most of them of hunger."
 ger_leningrad.1.a:0 "Leningrad is ours."
