l_english:
 ger_leningrad.1.t:0 "Into Leningrad"
 ger_leningrad.1.d:0 "Our troops have broken through to the shore of Lake Ladoga east of Leningrad and closed the ring around the city once more. Spearheads have forced their way into its southern districts, and the fighting is spreading street by street towards the Nevsky Prospect and the centre. The battle for Leningrad has begun.\n\nIn September 1941 the Führer ordered that the city was not to be taken but starved into ruin. Hundreds of thousands of its people have died since then, most of them of hunger."
 ger_leningrad.1.a:0 "The battle for Leningrad has begun."
